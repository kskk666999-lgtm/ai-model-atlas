# 数据来源注册表。
# level: A=官方结构化结果/官方仓库  B=官方榜单页/官方导出  C=有公开方法论的第三方  D=厂商自报（不进综合榜）
# status: active | disabled | optional
sources:
  - source_id: livebench
    source_name: LiveBench（官方）
    source_level: B
    homepage_url: https://livebench.ai
    method: official_export
    description: >
      LiveBench 官方排行榜导出（table_<release>.csv / categories_<release>.json /
      cost_<release>.csv，release 为官方版本日期）。按官方类别对任务分数取平均，
      并包含官方统计的输入/输出 API 价格。
    license: Apache-2.0（代码）；数据遵循 LiveBench 官方发布条款
    attribution: "数据来源：LiveBench (livebench.ai)，AGI evaluation by Abacus.AI 等"
    requires_api_key: false
    included_in_composite: true
    status: active
    docs_url: https://github.com/LiveBench/LiveBench

  - source_id: swebench
    source_name: SWE-bench（官方实验仓库）
    source_level: A
    homepage_url: https://www.swebench.com
    method: github_repo
    description: >
      SWE-bench 官方 experiments 仓库（github.com/SWE-bench/experiments）公开的
      每次评测运行的 metadata.yaml，含 resolved%、成本、Agent 框架与模型标签。
    license: MIT（代码）；结果数据遵循仓库发布条款
    attribution: "数据来源：SWE-bench Official Experiments (swebench.com)"
    requires_api_key: false
    included_in_composite: true
    status: active
    docs_url: https://github.com/SWE-bench/experiments

  - source_id: superclue
    source_name: SuperCLUE 中文通用榜（官方）
    source_level: B
    homepage_url: https://www.superclueai.com
    method: official_xlsx_export
    description: >
      SuperCLUE 官网公开的最新月度 XLSX，包含中文通用总分、数学推理、科学推理、
      幻觉控制、精确指令遵循、智能体编程与任务规划。官方只公开评测月份，
      本站不会把工作簿发布日期或抓取日冒充逐模型评测运行日。
    license: 数据遵循 SuperCLUE 官方发布条款
    attribution: "数据来源：SuperCLUE 中文大模型测评基准（superclueai.com）"
    requires_api_key: false
    included_in_composite: false
    status: active
    docs_url: https://github.com/CLUEbenchmark/SuperCLUE

  - source_id: kernelbench
    source_name: KernelBench.com v-hard（公开审计榜）
    source_level: C
    homepage_url: https://kernelbench.com
    method: public_audited_json
    description: >
      KernelBench.com 公开仓库的 v-hard 结构化结果，评测模型与 Agent harness 在
      固定 GPU 内核题集上的工程能力。适配器复核 annotation_verdict，排除
      reward-hack，并以完整题集作统一分母，避免部分运行显示成 100%。
    license: 数据遵循 KernelBench.com 仓库发布条款
    attribution: "数据来源：KernelBench.com v-hard public audited leaderboard"
    requires_api_key: false
    included_in_composite: false
    status: active
    docs_url: https://github.com/Infatoshi/kernelbench.com

  - source_id: superclue_vlm
    source_name: SuperCLUE-VLM 多模态视觉语言榜（官方）
    source_level: B
    homepage_url: https://www.superclueai.com
    method: official_xlsx_export
    description: >
      SuperCLUE 官网按月公开的 VLM 官方 XLSX，包含多模态总分、视觉基础认知、
      视觉推理与视觉应用。与文生图/视频生成榜分开，避免混淆理解能力和生成质量。
      官方只公开评测月份，本站不虚构逐模型评测日。
    license: 数据遵循 SuperCLUE 官方发布条款
    attribution: "数据来源：SuperCLUE-VLM（superclueai.com）"
    requires_api_key: false
    included_in_composite: false
    status: active
    docs_url: https://www.superclueai.com

  - source_id: superclue_longcontext
    source_name: SuperCLUE-LongContext 中文长上下文榜（官方）
    source_level: B
    homepage_url: https://www.superclueai.com
    method: official_xlsx_export
    description: >
      SuperCLUE 官网按月公开的中文超长上下文多轮检索 XLSX，分别提供 256K 与 1M
      总榜及各长度区间明细。本站只展示实际评测得分，不把标称上下文窗口当能力分。
    license: 数据遵循 SuperCLUE 官方发布条款
    attribution: "数据来源：SuperCLUE-LongContext（superclueai.com）"
    requires_api_key: false
    included_in_composite: false
    status: active
    docs_url: https://www.superclueai.com

  - source_id: terminalbench
    source_name: Terminal-Bench 4.0（官方）
    source_level: B
    homepage_url: https://www.tbench.ai/?version=4.0
    method: official_server_rendered_leaderboard
    description: >
      Terminal-Bench 4.0 官方榜单的服务端结构化数据，评测模型与 Agent 在真实终端任务中的
      完整系统成功率，并保留 Agent、推理档位、样本量、置信区间和榜单更新时间。
      官方未公开逐条评测运行日，本站不会用模型发布日期或榜单版本冒充。
    license: 数据遵循 Terminal-Bench 官方发布条款
    attribution: "数据来源：Terminal-Bench 4.0 Official Leaderboard (tbench.ai)"
    requires_api_key: false
    included_in_composite: false
    status: active
    docs_url: https://github.com/laude-institute/terminal-bench

  - source_id: bfcl
    source_name: Berkeley Function Calling Leaderboard V4（官方）
    source_level: B
    homepage_url: https://gorilla.cs.berkeley.edu/leaderboard.html
    method: official_csv_export
    description: >
      UC Berkeley BFCL V4 官方 CSV，覆盖函数/工具调用综合准确率、Web Search 与 Memory，
      并将 FC、Prompt、Thinking 等提交模式作为独立变体保留。官方未公开逐模型评测运行日，
      数据新鲜度取官方文件 Last-Modified。
    license: 数据遵循 BFCL / Gorilla 官方发布条款
    attribution: "数据来源：Berkeley Function Calling Leaderboard (gorilla.cs.berkeley.edu)"
    requires_api_key: false
    included_in_composite: false
    status: active
    docs_url: https://github.com/ShishirPatil/gorilla/tree/main/berkeley-function-call-leaderboard

  - source_id: bigcodebench
    source_name: BigCodeBench（官方）
    source_level: A
    homepage_url: https://bigcode-bench.github.io
    method: official_dataset
    description: >
      BigCodeBench 官方评测结果数据集（HF: bigcode/bigcodebench-results），
      包含 complete / instruct 两种模式下每个模型的通过率。
    license: Apache-2.0
    attribution: "数据来源：BigCodeBench (The official BigCodeBench leaderboard)"
    requires_api_key: false
    included_in_composite: true
    status: active
    docs_url: https://github.com/bigcode-project/bigcodebench

  - source_id: vlmevalkit
    source_name: VLMEvalKit / OpenVLM 官方结果（OpenCompass）
    source_level: A
    homepage_url: https://github.com/open-compass/VLMEvalKit
    method: official_json_asset
    description: >
      VLMEvalKit 官方维护的 OpenVLM 汇总结果（opencompass.openxlab.space/assets/OpenVLM.json），
      覆盖 MMBench、MME、MMMU、OCRBench、MathVista 等多模态基准的官方复现分数。
    license: Apache-2.0（代码）
    attribution: "数据来源：OpenCompass OpenVLM Leaderboard（VLMEvalKit 官方复现结果）"
    requires_api_key: false
    included_in_composite: true
    status: active
    docs_url: https://github.com/open-compass/OpenCompass

  - source_id: mteb
    source_name: MTEB（官方结果仓库）
    source_level: A
    homepage_url: https://mteb.dev
    method: github_repo
    description: >
      embeddings-benchmark/results 官方结果仓库中按模型按任务保存的 JSON 结果，
      覆盖 Embedding、检索、重排、语义相似度等任务。
    license: Apache-2.0
    attribution: "数据来源：MTEB (Massive Text Embedding Benchmark) 官方结果仓库"
    requires_api_key: false
    included_in_composite: true
    status: active
    docs_url: https://github.com/embeddings-benchmark/results

  - source_id: artificialanalysis
    source_name: Artificial Analysis（免费数据 API）
    source_level: C
    homepage_url: https://artificialanalysis.ai
    method: rest_api
    description: >
      Artificial Analysis 免费数据 API，提供价格、输出速度、首字延迟与智能指数。
      需要 API Key（仅保存在 GitHub Actions Secrets），每天限额 1000 次，
      页面按要求注明来源。未配置 Key 时其余榜单不受影响。
    license: 遵循 Artificial Analysis 服务条款
    attribution: "数据来源：Artificial Analysis（artificialanalysis.ai）"
    requires_api_key: true
    included_in_composite: false
    status: optional
    docs_url: https://docs.artificialanalysis.ai

  - source_id: livecodebench
    source_name: LiveCodeBench（官方）
    source_level: A
    homepage_url: https://livecodebench.github.io
    method: none
    description: >
      暂未启用：LiveCodeBench 官方榜单为编译后的 JS 包，未提供稳定可自动读取的
      结构化结果文件；官方仓库两个分支均无结果 JSON。为避免脆弱的逆向解析，
      该适配器保持 disabled，待官方提供结构化导出后接入。
    license: null
    attribution: null
    requires_api_key: false
    included_in_composite: false
    status: disabled

  - source_id: opencompass_text
    source_name: OpenCompass（中文学术评测）
    source_level: A
    homepage_url: https://rank.opencompass.org.cn
    method: official_json_asset_stale
    description: >
      暂未启用：OpenCompass 已公开 CompassAcademic 的 hf-academic.json，但该资产
      最后更新停在 2025-04，当前模型覆盖不足。为避免用旧快照占据 CURRENT 优先榜，
      暂不接入；中文当前能力改由 SuperCLUE 2026 月度官方 XLSX 覆盖，待该资产恢复
      持续更新后再启用。
    license: null
    attribution: null
    requires_api_key: false
    included_in_composite: false
    status: disabled

  - source_id: arena
    source_name: LMArena（人类偏好）
    source_level: C
    homepage_url: https://lmarena.ai
    method: none
    description: >
      暂未启用：LMArena 榜单无稳定、公开、允许自动读取的数据接口
      （页面受动态渲染与访问限制保护）。按要求不绕过任何防护，
      待存在合法稳定的数据形式后接入。
    license: null
    attribution: null
    requires_api_key: false
    included_in_composite: false
    status: disabled
