name: update-data

# 每 12 小时自动更新一次数据；也支持在 Actions 页面手动触发。
# 全流程为普通 Python 抓取 + 确定性计算，不调用任何大模型 API。
# 注意：不要添加 workflow_run 触发器——数据提交通过 push 事件自然触发
# ci 与 deploy-pages，额外触发会造成重复运行。

on:
  schedule:
    - cron: "0 1,13 * * *" # UTC 01:00 / 13:00 ≈ 北京时间 09:00 / 21:00
  workflow_dispatch:
    inputs:
      sources:
        description: "仅更新指定来源（逗号分隔，留空为全部）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 运行数据更新流水线
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            python -m pipeline.update --sources "${{ github.event.inputs.sources }}"
          else
            python -m pipeline.update
          fi

      - name: 数据完整性检查（核心校验失败时流水线已以退出码 2 中止）
        run: |
          python - <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path("public/data/meta.json").read_text(encoding="utf-8"))
          assert meta["demo_mode"] is False
          assert meta["counts"]["records"] > 0, "成绩记录为空，禁止发布"
          print("数据完整性 OK:", meta["counts"])
          PY

      - name: 无 LLM 运行时校验
        run: python scripts/verify-no-llm-runtime.py

      - name: 有变化时提交
        id: commit
        run: |
          git config user.name "ai-model-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/reports data/cache/records data/history
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交（幂等输出保证）"
          else
            git commit -m "chore(data): 自动更新榜单数据 $(date -u +%FT%TZ)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送
        if: steps.commit.outputs.changed == 'true'
        run: git push

      - name: 失败时上传诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-data-logs
          path: |
            data/reports/
          if-no-files-found: ignore
          retention-days: 14
