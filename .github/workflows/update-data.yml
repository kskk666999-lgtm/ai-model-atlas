name: update-data

# 每日计划更新两次（UTC 01:00 / 13:00 ≈ 北京时间 09:00 / 21:00）；
# 定时任务并非绝对准点，平台高峰期可能略有延迟。也支持在 Actions 页面手动触发。
# 全流程为普通 Python 抓取 + 确定性计算，不调用任何大模型 API。
# GITHUB_TOKEN 推送不会触发新的 push 工作流，因此数据提交成功后显式触发
# deploy-pages；无需额外的 workflow_run 触发器。

on:
  schedule:
    - cron: "0 1,13 * * *" # UTC 01:00 / 13:00 ≈ 北京时间 09:00 / 21:00
  workflow_dispatch:
    inputs:
      sources:
        description: "仅更新指定来源（逗号分隔，留空为全部）"
        required: false
        default: ""

permissions:
  actions: write
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 运行数据更新流水线
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            python -m pipeline.update --sources "${{ github.event.inputs.sources }}"
          else
            python -m pipeline.update
          fi

      - name: 数据完整性检查（核心校验失败时流水线已以退出码 2 中止）
        run: |
          python - <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path("public/data/meta.json").read_text(encoding="utf-8"))
          assert meta["demo_mode"] is False
          assert meta["counts"]["records"] > 0, "成绩记录为空，禁止发布"
          print("数据完整性 OK:", meta["counts"])
          PY

      - name: 无 LLM 运行时校验
        run: python scripts/verify-no-llm-runtime.py

      - name: 有变化时提交
        id: commit
        run: |
          git config user.name "ai-model-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/reports data/cache/records data/history
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交（幂等输出保证）"
          else
            git commit -m "chore(data): 自动更新榜单数据 $(date -u +%FT%TZ)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送
        if: steps.commit.outputs.changed == 'true'
        run: git push

      - name: 数据变化后触发 Pages 部署
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: 失败时上传诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-data-logs
          path: |
            data/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: 失败时创建/更新提醒 Issue（不重复建帖）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TITLE="🚨 数据更新失败待处理"
          BODY="update-data 工作流失败于 $(date -u '+%FT%TZ')。
          - 运行日志: $RUN_URL
          - 影响评估: 失败来源已自动回退上次成功数据（LKG），线上榜单不受影响；
            若反复失败或全部来源失败，请检查日志是否为上游数据格式变化。"
          EXISTING=$(gh issue list --state open --search "数据更新失败待处理 in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "已在已有提醒 Issue #$EXISTING 追加记录"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "已创建提醒 Issue"
          fi
