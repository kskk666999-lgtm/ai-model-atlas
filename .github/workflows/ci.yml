name: ci

# push 到 main 或 PR 时运行；数据自动提交（public/data、data/**）不需要完整 CI，
# 通过 paths-ignore 跳过，避免每个数据提交都跑一遍全套检查。

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
      - "data/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "public/data/**"
      - "data/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ruff 代码检查
        run: ruff check pipeline tests scripts
      - name: Python 单元测试
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript 类型检查
        run: npm run typecheck
      - name: 前端测试
        run: npm run test
      - name: 生产构建（拒绝 DEMO_MODE）
        env:
          DEMO_MODE: "false"
        run: npm run build
